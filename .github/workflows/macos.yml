name: macOS 26 Build and Tests

on:
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Swift tests and app bundle
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Test core
        run: swift test --parallel
      - name: Build application
        run: bash scripts/package-app.sh release
      - name: Verify bundle
        run: |
          test -x dist/CleanJunk.app/Contents/MacOS/CleanJunk
          plutil -lint dist/CleanJunk.app/Contents/Info.plist
          codesign --verify --strict --verbose=2 dist/CleanJunk.app
      - name: Publish private prerelease (Actions artifact storage not required)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="preview-$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease \
              --title "CleanJunk development preview $TAG" \
              --notes "Internal macOS 26 build. Ad-hoc signed; not Apple notarized. Do not treat as production-ready."
          fi
          gh release upload "$TAG" dist/*.zip dist/*.sha256 --clobber
          gh release view "$TAG" --json url --jq .url
