name: Manual macOS 26 Build and Tests

# Never run on push or PR: this workflow is intentionally manual to protect quota.
on:
  workflow_dispatch:
    inputs:
      publish_preview:
        description: "Publish an ad-hoc signed preview to GitHub Releases"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cleanjunk-manual-build
  cancel-in-progress: false

jobs:
  validate:
    name: Swift tests and app bundle
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Test core
        run: swift test --parallel
      - name: Build application
        run: bash scripts/package-app.sh release
      - name: Verify bundle
        run: |
          test -x dist/CleanJunk.app/Contents/MacOS/CleanJunk
          plutil -lint dist/CleanJunk.app/Contents/Info.plist
          codesign --verify --strict --verbose=2 dist/CleanJunk.app
          (cd dist && shasum -a 256 -c *.sha256)

  publish:
    name: Explicit private preview
    needs: validate
    if: ${{ inputs.publish_preview == true }}
    permissions:
      contents: write
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and package
        run: bash scripts/package-app.sh release
      - name: Publish prerelease (no Actions artifact quota)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="preview-$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease \
              --title "CleanJunk development preview $TAG" \
              --notes "Internal macOS 26 build. Ad-hoc signed; not Apple notarized."
          fi
          gh release upload "$TAG" dist/*.zip dist/*.sha256 --clobber
          gh release view "$TAG" --json url --jq .url
